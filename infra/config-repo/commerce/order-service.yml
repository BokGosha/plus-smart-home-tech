server:
  port: 0

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
      circuitbreaker:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      product-service:
        ignoreExceptions:
          - ru.yandex.practicum.order.exception.RemoteNotFoundException
      inventory-service:
        ignoreExceptions:
          - ru.yandex.practicum.order.exception.RemoteNotFoundException
          - ru.yandex.practicum.order.exception.InsufficientStockException
  timelimiter:
    configs:
      default:
        # Чуть выше readTimeout (3000ms), чтобы при таймауте срабатывал
        # сетевой таймаут Feign с понятной причиной, а не TimeLimiter.
        timeout-duration: 3500ms